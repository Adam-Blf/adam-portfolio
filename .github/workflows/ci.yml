name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Gardes, types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Gardes de source (contenu, typographie, données personnelles, icônes, langues, schémas, routes, polices)
        run: npm run guards

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (gardes vues rouges, schémas, formulaire, contrastes, synchro)
        run: npm test

      - name: Contrôle du script Deno
        run: deno check scripts/sync/main.ts

      - name: Build
        run: npm run build

      - name: Gardes du build (aucun CDN, budgets de poids)
        run: npm run guards:built

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
